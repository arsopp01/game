<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Catcher</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid #333;
            overflow: hidden;
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 2;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            min-width: 300px;
        }
        
        .hidden {
            display: none !important;
        }
        
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            background: #4CAF50;
            border: none;
            color: white;
            border-radius: 5px;
            transition: 0.3s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        #achievementsPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            color: white;
            z-index: 3;
            min-width: 300px;
        }
        
        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }
        
        #debug {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }

        .achievement {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .achievement.locked {
            opacity: 0.5;
        }

        .achievement-icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .achievement-info {
            flex: 1;
        }

        .achievement-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .achievement-description {
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="menu">
            <h1>Star Catcher</h1>
            <button id="startButton">Начать игру</button>
            <button id="achievementsButton">Достижения</button>
        </div>
        <div id="achievementsPanel" class="hidden">
            <button class="close-button">×</button>
            <h2>Достижения</h2>
            <div id="achievementsList"></div>
        </div>
        <div id="debug"></div>
    </div>

    <!-- Game Scripts -->
    <script src="game.js"></script>
    <script>
        function initializeGame() {
            try {
                if (typeof window.initGame === 'function') {
                    window.initGame();
                } else {
                    throw new Error('Game initialization function not found');
                }
            } catch (error) {
                console.error('Failed to initialize game:', error);
                const debug = document.getElementById('debug');
                if (debug) {
                    debug.textContent = `Error: ${error.message}`;
                }
            }
        }

        // Initialize when everything is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeGame);
        } else {
            initializeGame();
        }
    </script>
</body>
</html>
